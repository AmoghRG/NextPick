name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          pip install duckdb numpy pandas pyarrow pytest pytest-cov torch onnx onnxscript onnxruntime fastapi httpx qdrant-client redis lightgbm
      - name: Run pytest with coverage gate
        run: PYTHONPATH=. pytest -v --cov=src --cov-report=term-missing --cov-fail-under=85

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build Next.js UI
        working-directory: web
        run: |
          npm install
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image on clean clone
        run: docker build -t nextpick-api:ci .
